name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications/ | grep -i xcode || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest" || true; fi
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild -project Shengongyi.xcodeproj \
            -scheme Shengongyi \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          test -n "$APP"
          rm -rf Payload Shengongyi-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r Shengongyi-unsigned.ipa Payload
          ls -lh Shengongyi-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shengongyi-unsigned-ipa
          path: Shengongyi-unsigned.ipa
